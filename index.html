<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mérida — Asistente personal</title>
<meta name="theme-color" content="#0a0e1a">
<meta name="description" content="Mérida: asistente conversacional offline, multilingüe y propio.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0e1a;--panel:#131824;--panel2:#1a2030;--panel3:#232a3d;
  --text:#e6e9f2;--muted:#8a93a8;--accent:#6ea8fe;--accent2:#a78bfa;
  --user:#2a4d8f;--ai:#1a2138;--border:#2a3355;--danger:#e05a5a;--success:#4ade80;
  --warning:#fbbf24;--radius:12px;--shadow:0 10px 40px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3a4560}

/* ---------- LAYOUT ---------- */
#app{display:flex;height:100vh;height:100dvh;overflow:hidden}

/* ---------- SIDEBAR ---------- */
#sidebar{
  width:290px;background:var(--panel);display:flex;flex-direction:column;
  border-right:1px solid var(--border);transition:transform .28s ease;
  flex-shrink:0;
}
#sidebarHeader{
  padding:14px 16px;border-bottom:1px solid var(--border);
  display:flex;flex-direction:column;gap:10px;
}
#brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem}
#brand .dot{width:10px;height:10px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success)}
#brand .dot.off{background:var(--danger);box-shadow:0 0 8px var(--danger)}
#newChat{
  background:var(--accent);color:var(--bg);padding:9px 12px;border-radius:10px;
  font-weight:700;font-size:.85rem;display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s;
}
#newChat:hover{background:#8fbcff}
#searchBox{
  background:var(--panel2);border:1px solid var(--border);border-radius:8px;
  padding:7px 10px;font-size:.85rem;color:var(--text);width:100%;
}
#searchBox:focus{outline:none;border-color:var(--accent)}
#chatList{
  flex:1;overflow-y:auto;list-style:none;padding:8px;scrollbar-width:thin;
}
#chatList .empty{color:var(--muted);font-size:.82rem;padding:20px 10px;text-align:center}
#chatList li{
  padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:3px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.87rem;
  transition:background .15s;
}
#chatList li:hover{background:var(--panel2)}
#chatList li.active{background:var(--panel2);border-left:3px solid var(--accent);padding-left:9px}
#chatList li .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chatList li .meta{font-size:.68rem;color:var(--muted);margin-top:2px}
#chatList li .actions{display:flex;gap:2px;opacity:0;transition:opacity .15s}
#chatList li:hover .actions{opacity:1}
#chatList li .actions button{
  background:none;border:none;color:var(--muted);cursor:pointer;
  padding:3px 4px;font-size:.85rem;border-radius:4px;
}
#chatList li .actions button:hover{color:var(--danger);background:var(--panel3)}
#sidebarFooter{
  padding:10px 12px;border-top:1px solid var(--border);
  display:flex;gap:6px;flex-wrap:wrap;
}
#sidebarFooter button{
  flex:1;min-width:70px;background:var(--panel2);border:1px solid var(--border);
  padding:8px 6px;border-radius:8px;font-size:.75rem;
  display:flex;align-items:center;justify-content:center;gap:4px;
  transition:background .15s;
}
#sidebarFooter button:hover{background:var(--panel3)}

/* ---------- MAIN ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#chatHeader{
  padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-shrink:0;
}
#chatHeader h2{
  font-size:.95rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;flex:1;
}
#chatHeader .headerActions{display:flex;gap:4px}
#chatHeader button{
  background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:1rem;padding:6px 8px;border-radius:6px;transition:all .15s;
}
#chatHeader button:hover{color:var(--text);background:var(--panel2)}
#menuBtn{display:none}
#searchInChat{display:none;padding:8px 18px;background:var(--panel2);border-bottom:1px solid var(--border)}
#searchInChat.show{display:block}
#searchInChat input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:.85rem}

/* ---------- MESSAGES ---------- */
#messages{
  flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:14px;
  max-width:900px;margin:0 auto;width:100%;scroll-behavior:smooth;
}
.msg{display:flex;gap:10px;align-items:flex-start;animation:fadeIn .25s ease}
.msg.user{justify-content:flex-end}
.msg.ai .avatar{
  width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
}
.msg.user .avatar{
  width:32px;height:32px;border-radius:50%;background:var(--panel3);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
}
.msgContent{max-width:80%;min-width:0}
.bubble{
  padding:11px 15px;border-radius:16px;line-height:1.55;
  white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;font-size:.93rem;
  position:relative;
}
.msg.user .bubble{background:var(--user);border-top-right-radius:4px}
.msg.ai .bubble{background:var(--ai);border-top-left-radius:4px}
.bubble strong,.bubble b{font-size:1.16em;font-weight:700;display:inline-block;margin:4px 0;color:#fff}
.bubble h2{font-size:1.28em;font-weight:700;margin:10px 0 6px;color:#fff}
.bubble h3{font-size:1.14em;font-weight:700;margin:8px 0 4px;color:#fff}
.bubble img{max-width:100%;border-radius:10px;margin-top:8px;display:block;border:1px solid var(--border)}
.bubble a{color:var(--accent);text-decoration:underline}
.bubble code{
  background:#0a0e1a;padding:2px 6px;border-radius:4px;
  font-family:ui-monospace,"SF Mono",Consolas,Menlo,monospace;
  font-size:.88em;color:#a5d6ff;
}
.bubble pre{
  background:#0a0e1a;padding:12px 14px;border-radius:8px;overflow-x:auto;
  margin:8px 0;font-size:.82em;border:1px solid var(--border);position:relative;
}
.bubble pre code{background:none;padding:0;color:var(--text)}
.bubble pre .copyCode{
  position:absolute;top:6px;right:6px;background:var(--panel2);border:1px solid var(--border);
  color:var(--muted);padding:2px 8px;border-radius:4px;font-size:.7em;cursor:pointer;
}
.bubble pre .copyCode:hover{color:var(--text)}
.bubble ul,.bubble ol{padding-left:1.4em;margin:6px 0}
.bubble li{margin:3px 0}
.bubble blockquote{border-left:3px solid var(--accent);padding-left:10px;margin:8px 0;color:var(--muted)}
.bubble table{border-collapse:collapse;margin:8px 0;font-size:.88em}
.bubble td,.bubble th{border:1px solid var(--border);padding:5px 9px}
.bubble th{background:var(--panel2)}
.msgMeta{font-size:.7rem;color:var(--muted);margin-top:5px;display:flex;gap:8px;align-items:center}
.msgMeta button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.75rem;padding:1px 4px;border-radius:3px}
.msgMeta button:hover{color:var(--text);background:var(--panel3)}
.typing{display:inline-block}
.typing::after{content:'';animation:dots 1.4s infinite steps(4)}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ---------- INPUT ---------- */
#inputArea{
  padding:12px 18px 16px;background:var(--panel);border-top:1px solid var(--border);
  flex-shrink:0;
}
#inputRow{display:flex;gap:8px;align-items:flex-end;max-width:900px;margin:0 auto}
#input{
  flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:14px;
  padding:11px 14px;font-size:.93rem;resize:none;min-height:44px;max-height:200px;
  line-height:1.5;transition:border-color .15s;
}
#input:focus{outline:none;border-color:var(--accent)}
#sendBtn{
  background:var(--accent);color:var(--bg);border:none;padding:0 20px;border-radius:14px;
  font-weight:700;height:44px;font-size:.9rem;transition:all .15s;flex-shrink:0;
}
#sendBtn:hover:not(:disabled){background:#8fbcff}
#sendBtn:disabled{opacity:.5;cursor:wait}
#statusBar{
  font-size:.75rem;color:var(--muted);padding:2px 18px 0;max-width:900px;margin:0 auto;
  min-height:16px;
}
#scrollBottom{
  position:absolute;bottom:90px;right:20px;width:38px;height:38px;border-radius:50%;
  background:var(--panel2);border:1px solid var(--border);color:var(--text);
  display:none;align-items:center;justify-content:center;font-size:1.1rem;
  box-shadow:var(--shadow);z-index:10;
}
#scrollBottom.show{display:flex}
#scrollBottom:hover{background:var(--panel3)}

/* ---------- SETTINGS PANEL ---------- */
.settingsPanel{
  position:fixed;top:0;right:0;bottom:0;width:360px;max-width:100vw;
  background:var(--panel);border-left:1px solid var(--border);padding:20px;
  transform:translateX(100%);transition:transform .3s ease;z-index:50;
  overflow-y:auto;
}
.settingsPanel.open{transform:translateX(0)}
.settingsPanel .closeBtn{
  position:absolute;top:12px;right:14px;font-size:1.5rem;color:var(--text);
  background:none;border:none;padding:4px 8px;border-radius:6px;
}
.settingsPanel .closeBtn:hover{background:var(--panel2)}
.settingsPanel h3{margin-bottom:18px;font-size:1.1rem}
.settingsPanel label{
  display:block;margin:14px 0 5px;font-size:.8rem;color:var(--muted);
  font-weight:600;text-transform:uppercase;letter-spacing:.4px;
}
.settingsPanel input[type=text],
.settingsPanel input[type=number],
.settingsPanel select{
  width:100%;background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;padding:9px 11px;font-size:.9rem;
}
.settingsPanel input[type=text]:focus,
.settingsPanel select:focus{outline:none;border-color:var(--accent)}
.settingsPanel .checkRow{
  display:flex;align-items:center;gap:8px;margin:10px 0;
  font-size:.9rem;color:var(--text);text-transform:none;letter-spacing:0;font-weight:400;
}
.settingsPanel .checkRow input{width:auto}
.settingsPanel button.primary{
  margin-top:22px;width:100%;background:var(--accent);color:var(--bg);
  padding:11px;border-radius:10px;font-weight:700;font-size:.9rem;
}
.settingsPanel button.primary:hover{background:#8fbcff}
.settingsPanel .section{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.settingsPanel .section h4{font-size:.9rem;margin-bottom:10px}

/* ---------- TOASTS ---------- */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  background:var(--panel2);border:1px solid var(--border);border-radius:10px;
  padding:10px 16px;font-size:.85rem;box-shadow:var(--shadow);
  animation:toastIn .3s ease;pointer-events:auto;max-width:400px;
}
.toast.error{border-color:var(--danger);color:#ffbaba}
.toast.success{border-color:var(--success);color:#a7f3d0}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ---------- REMINDER MODAL ---------- */
.modalBackdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;
  align-items:center;justify-content:center;z-index:80;padding:20px;
}
.modalBackdrop.open{display:flex}
.modalBox{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:20px;max-width:420px;width:100%;box-shadow:var(--shadow);
}
.modalBox h3{margin-bottom:10px;font-size:1.1rem}
.modalBox p{margin-bottom:14px;color:var(--muted);font-size:.9rem}
.modalBox .actions{display:flex;gap:8px;justify-content:flex-end}
.modalBox button{padding:8px 16px;border-radius:8px;font-weight:600;font-size:.88rem}
.modalBox .cancel{background:var(--panel2);border:1px solid var(--border)}
.modalBox .confirm{background:var(--accent);color:var(--bg)}

/* ---------- MOBILE ---------- */
@media (max-width:760px){
  #sidebar{
    position:absolute;left:0;top:0;height:100%;z-index:60;
    transform:translateX(-100%);box-shadow:4px 0 20px rgba(0,0,0,.5);
  }
  #sidebar.open{transform:translateX(0)}
  #menuBtn{display:block}
  .msgContent{max-width:88%}
  #messages{padding:16px 12px}
  .settingsPanel{width:100vw}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="sidebarHeader">
      <div id="brand"><span class="dot" id="onlineDot"></span> 🧠 Mérida</div>
      <button id="newChat">＋ Nuevo chat</button>
      <input id="searchBox" type="text" placeholder="🔍 Buscar en conversaciones…">
    </div>
    <ul id="chatList"></ul>
    <div id="sidebarFooter">
      <button id="exportAll" title="Exportar todas las conversaciones">⬇ Exportar</button>
      <button id="importBtn" title="Importar conversaciones">⬆ Importar</button>
      <button id="clearAll" title="Borrar todo">🗑 Borrar todo</button>
    </div>
  </aside>

  <main id="main">
    <header id="chatHeader">
      <button id="menuBtn" aria-label="Menú">☰</button>
      <h2 id="chatTitle">Nueva conversación</h2>
      <div class="headerActions">
        <button id="searchChatBtn" title="Buscar en este chat">🔍</button>
        <button id="exportChatBtn" title="Exportar este chat">⬇</button>
        <button id="deleteChatBtn" title="Eliminar este chat">🗑</button>
        <button id="settingsBtn" title="Ajustes">⚙</button>
      </div>
    </header>
    <div id="searchInChat">
      <input id="searchInChatInput" type="text" placeholder="Buscar en este chat…">
    </div>
    <div id="messages" aria-live="polite"></div>
    <button id="scrollBottom" title="Ir al final">⬇</button>
    <div id="statusBar"></div>
    <div id="inputArea">
      <form id="inputForm">
        <div id="inputRow">
          <textarea id="input" placeholder="Escríbeme… (Enter = enviar · Shift+Enter = nueva línea)" rows="1"></textarea>
          <button id="sendBtn" type="submit">Enviar</button>
        </div>
      </form>
    </div>
  </main>
</div>

<div class="settingsPanel" id="settingsPanel">
  <button class="closeBtn" id="settingsClose">×</button>
  <h3>⚙ Ajustes de Mérida</h3>

  <label>Tu nombre</label>
  <input type="text" id="prefName" placeholder="¿Cómo te llamas?">

  <label>Idioma preferido</label>
  <select id="prefLang">
    <option value="auto">🌐 Detectar automáticamente</option>
    <option value="es">🇪🇸 Español</option>
    <option value="en">🇬🇧 English</option>
    <option value="pt">🇵🇹 Português</option>
    <option value="fr">🇫🇷 Français</option>
    <option value="de">🇩🇪 Deutsch</option>
    <option value="it">🇮🇹 Italiano</option>
  </select>

  <label>Nivel de detalle</label>
  <select id="prefDetail">
    <option value="auto">Automático (según la pregunta)</option>
    <option value="short">Breve</option>
    <option value="long">Detallado</option>
  </select>

  <label>Tono</label>
  <select id="prefTone">
    <option value="neutral">Neutral</option>
    <option value="formal">Formal</option>
    <option value="casual">Casual y cercano</option>
  </select>

  <div class="section">
    <h4>🔔 Notificaciones y recordatorios</h4>
    <div class="checkRow">
      <input type="checkbox" id="prefNotif">
      <label for="prefNotif" style="margin:0;text-transform:none;letter-spacing:0;font-size:.9rem">Permitir notificaciones del sistema</label>
    </div>
    <div class="checkRow">
      <input type="checkbox" id="prefSounds">
      <label for="prefSounds" style="margin:0;text-transform:none;letter-spacing:0;font-size:.9rem">Sonido al recibir recordatorios</label>
    </div>
    <button id="testNotif" style="margin-top:8px;background:var(--panel2);border:1px solid var(--border);padding:7px 12px;border-radius:8px;font-size:.8rem">Probar notificación</button>
  </div>

  <div class="section">
    <h4>🧠 Memoria y aprendizaje</h4>
    <div class="checkRow">
      <input type="checkbox" id="prefCrossChat" checked>
      <label for="prefCrossChat" style="margin:0;text-transform:none;letter-spacing:0;font-size:.9rem">Recordar entre conversaciones</label>
    </div>
    <div class="checkRow">
      <input type="checkbox" id="prefLearn" checked>
      <label for="prefLearn" style="margin:0;text-transform:none;letter-spacing:0;font-size:.9rem">Aprender de nuestras charlas</label>
    </div>
    <button id="clearFacts" style="margin-top:8px;background:var(--panel2);border:1px solid var(--border);padding:7px 12px;border-radius:8px;font-size:.8rem">Olvidar lo aprendido sobre mí</button>
  </div>

  <div class="section">
    <h4>🌐 Conexión</h4>
    <div class="checkRow">
      <input type="checkbox" id="prefOnline" checked>
      <label for="prefOnline" style="margin:0;text-transform:none;letter-spacing:0;font-size:.9rem">Permitir consultas a internet (Wikipedia)</label>
    </div>
  </div>

  <button class="primary" id="savePrefs">Guardar ajustes</button>
</div>

<div id="toasts"></div>

<div class="modalBackdrop" id="modalBackdrop">
  <div class="modalBox">
    <h3 id="modalTitle">Confirmar</h3>
    <p id="modalText"></p>
    <div class="actions">
      <button class="cancel" id="modalCancel">Cancelar</button>
      <button class="confirm" id="modalConfirm">Aceptar</button>
    </div>
  </div>
</div>

<input type="file" id="importFile" accept=".json" style="display:none">

<script>
'use strict';
/* ==========================================================
   MÉRIDA — Núcleo completo
   ========================================================== */
   
   /* ---------- UTILIDADES BÁSICAS ---------- */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalize(w){return String(w).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\p{L}\p{N}]/gu,'')}
function tokenize(text){return (String(text).match(/[\p{L}\p{N}]+/gu)||[]).map(normalize).filter(Boolean)}
function showToast(msg, type='info', ms=3500){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, ms);
}
function confirmDialog(title, text){
  return new Promise(resolve => {
    $('#modalTitle').textContent = title;
    $('#modalText').textContent = text;
    $('#modalBackdrop').classList.add('open');
    const close = ok => {
      $('#modalBackdrop').classList.remove('open');
      $('#modalConfirm').removeEventListener('click', onOk);
      $('#modalCancel').removeEventListener('click', onNo);
      resolve(ok);
    };
    const onOk = () => close(true);
    const onNo = () => close(false);
    $('#modalConfirm').addEventListener('click', onOk);
    $('#modalCancel').addEventListener('click', onNo);
  });
}

/* ---------- LEVENSHTEIN + DISTANCIA FONÉTICA ---------- */
function levenshtein(a, b){
  if (a.length === 0) return b.length;
  if (b.length === 0) return a.length;
  if (a === b) return 0;
  let prev = Array.from({length: a.length + 1}, (_, i) => i);
  for (let i = 1; i <= b.length; i++){
    const cur = [i];
    for (let j = 1; j <= a.length; j++){
      cur[j] = b[i-1] === a[j-1]
        ? prev[j-1]
        : 1 + Math.min(prev[j-1], cur[j-1], prev[j]);
    }
    prev = cur;
  }
  return prev[a.length];
}

// Clave fonética simple (inspirada en Metaphone para español)
function phoneticKey(word){
  let w = normalize(word);
  if (!w) return '';
  w = w.replace(/[^a-z]/g, '');
  // Reglas de simplificación fonética en español
  w = w.replace(/ph/g, 'f');
  w = w.replace(/[cq]/g, 'k');
  w = w.replace(/z/g, 's');
  w = w.replace(/[vw]/g, 'b');
  w = w.replace(/ll/g, 'y');
  w = w.replace(/ñ/g, 'n');
  w = w.replace(/h/g, '');
  w = w.replace(/[áàä]/g, 'a').replace(/[éèë]/g, 'e').replace(/[íìï]/g, 'i').replace(/[óòö]/g, 'o').replace(/[úùü]/g, 'u');
  w = w.replace(/(.)\1+/g, '$1'); // letras repetidas
  if (w.length > 1) {
    w = w[0] + w.slice(1).replace(/[aeiou]/g, '');
  }
  return w.slice(0, 6);
}

  de:['der','die','das','und','ist','was','wie','hallo','danke','will','kann','brauche','sag','erzähl'],
  it:['il','la','di','e','che','è','come','ciao','grazie','sono','voglio','posso','bisogno','dimmi','racconta']
};
function detectLang(text){
  const t = ' ' + String(text).toLowerCase() + ' ';
  let best = 'es', bestScore = 0;
  for (const [lang, words] of Object.entries(LANG_HINTS)){
    let score = 0;
    for (const w of words){
      if (t.includes(' ' + w + ' ')) score += 2;
      else if (t.includes(' ' + w)) score += 1;
    }
    if (score > bestScore){ bestScore = score; best = lang; }
  }
  return LANGS.includes(best) ? best : 'es';
}

class SpellCorrector{
  constructor(dictionary){
    this.dict = new Set();
    this.phoneticMap = new Map();
    this.byLen = new Map();
    for (const w of dictionary){
      const n = normalize(w);
      if (!n || n.length < 2) continue;
      this.dict.add(n);
      const pk = phoneticKey(n);
      if (!this.phoneticMap.has(pk)) this.phoneticMap.set(pk, []);
      this.phoneticMap.get(pk).push(n);
      if (!this.byLen.has(n.length)) this.byLen.set(n.length, []);
      this.byLen.get(n.length).push(n);
    }
  }
  correctWord(word){
    const lower = word.toLowerCase();
    if (COMMON_TYPOS[lower]){
      const c = COMMON_TYPOS[lower];
      return word[0] === word[0].toUpperCase() ? c[0].toUpperCase() + c.slice(1) : c;
    }
    const n = normalize(word);
    if (n.length < 3 || this.dict.has(n)) return word;
    // 1. Fonética
    const pk = phoneticKey(n);
    const phonCands = this.phoneticMap.get(pk) || [];
    if (phonCands.length === 1) return phonCands[0];
    if (phonCands.length > 1){
      let best = phonCands[0], bestD = 99;
      for (const c of phonCands){
        const d = levenshtein(n, c);
        if (d < bestD){ bestD = d; best = c; }
      }
      if (bestD <= 2) return best;
    }
    // 2. Levenshtein por longitud ±2
    let best = null, bestDist = 3;
    for (let L = Math.max(2, n.length - 2); L <= n.length + 2; L++){
      const cands = this.byLen.get(L) || [];
      for (const c of cands){
        const d = levenshtein(n, c);
        if (d < bestDist){ bestDist = d; best = c; if (d === 1) break; }
      }
      if (bestDist === 1) break;
    }
    return best && bestDist <= 2 ? best : word;
  }
  correct(text){
    return String(text).split(/(\s+)/).map(part => {
      if (/^\s+$/.test(part)) return part;
      return this.correctWord(part);
    }).join('');
  }
}

/* ---------- SOLUCIONADOR MATEMÁTICO ---------- */
class MathSolver{
  static solve(input){
    let str = String(input).replace(/\s+/g, '').replace(/,/g, '.').toLowerCase();
    str = str.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
    str = str.replace(/sqrt/g, '√').replace(/pi/gi, 'π');
    let pos = 0;
    const peek = () => str[pos];
    const eat = () => str[pos++];
    function expr(){
      let l = term();
      while (peek() === '+' || peek() === '-'){
        const op = eat(); const r = term();
        l = op === '+' ? l + r : l - r;
      }
      return l;
    }
    function term(){
      let l = power();
      while (peek() === '*' || peek() === '/' || peek() === '%'){
        const op = eat(); const r = power();
        if (op === '*') l *= r;
        else if (op === '/') l /= r;
        else l %= r;
      }
      return l;
    }
    function power(){
      const base = unary();
      if (peek() === '^'){ eat(); return Math.pow(base, power()); }
      return base;
    }
    function unary(){
      if (peek() === '-'){ eat(); return -unary(); }
      if (peek() === '+'){ eat(); return unary(); }
      return primary();
    }
    function primary(){
      if (peek() === '('){
        eat(); const v = expr();
        if (peek() === ')') eat();
        return v;
      }
      if (peek() === '√'){
        eat();
        if (peek() === '('){
          eat(); const v = expr();
          if (peek() === ')') eat();
          return Math.sqrt(v);
        }
        return Math.sqrt(primary());
      }
      const fn = str.slice(pos).match(/^(sin|cos|tan|log|ln|abs|floor|ceil|round|exp|min|max|pow)\(/);
      if (fn){
        pos += fn[0].length;
        const args = [expr()];
        while (peek() === ','){ eat(); args.push(expr()); }
        if (peek() === ')') eat();
        const fns = {sin:Math.sin,cos:Math.cos,tan:Math.tan,log:Math.log10,ln:Math.log,abs:Math.abs,floor:Math.floor,ceil:Math.ceil,round:Math.round,exp:Math.exp,min:Math.min,max:Math.max,pow:Math.pow};
        return fns[fn[1]](...args);
      }
      if (peek() === 'π'){ eat(); return Math.PI; }
      const n = str.slice(pos).match(/^\d+(\.\d+)?/);
      if (n){ pos += n[0].length; return parseFloat(n[0]); }
      throw new Error('Expresión inválida');
    }
    const result = expr();
    if (pos < str.length) throw new Error('Símbolo inesperado: ' + str[pos]);
    if (!isFinite(result)) throw new Error('Resultado no finito');
    // Redondeo inteligente
    if (Math.abs(result) < 1e-10) return 0;
    if (Number.isInteger(result)) return result;
    return Math.round(result * 1e10) / 1e10;
  }
  static isMathQuery(text){
    const t = String(text).replace(/[¿?¡!]/g, '').trim();
    if (/^(calcula|resuelve|cuanto es|cuánto es|compute|solve|what is|what's|quanto é|quanto e)\b/i.test(t) && /[\d\+\-\*\/\^\(\)]/i.test(t)) return true;
    if (/^[\d\s\+\-\*\/\(\)\.\^%,×÷√π]+$/i.test(t) && /\d/.test(t) && /[\+\-\*\/\^%]/.test(t)) return true;
    return false;
  }
  static extractExpression(text){
    const m = String(text).replace(/[¿?¡!]/g, '').match(/(?:calcula|resuelve|cuanto es|cuánto es|compute|solve|what is|what's|quanto é|quanto e)\s*(.+)/i);
    return m ? m[1].trim() : text;
  }
  // Ecuaciones lineales: ax + b = c
  static solveLinear(text){
    const m = String(text).replace(/\s+/g, '').match(/^(-?\d*\.?\d*)\s*x\s*([+\-]\s*\d+\.?\d*)?\s*=\s*(-?\d+\.?\d*)$/i);
    if (!m) return null;
    let a = m[1];
    if (a === '' || a === '+') a = 1;
    else if (a === '-') a = -1;
    else a = parseFloat(a);
    const b = m[2] ? parseFloat(m[2].replace(/\s/g, '')) : 0;
    const c = parseFloat(m[3]);
    if (a === 0) return null;
    const x = (c - b) / a;
    return { x, a, b, c };
  }
}

/* ---------- CONVERSOR DE UNIDADES ---------- */
class UnitConverter{
  static UNITS = {
    km:{type:'length', toBase: v => v * 1000}, m:{type:'length', toBase: v => v},
    cm:{type:'length', toBase: v => v / 100}, mm:{type:'length', toBase: v => v / 1000},
    mi:{type:'length', toBase: v => v * 1609.344}, ft:{type:'length', toBase: v => v * 0.3048},
    in:{type:'length', toBase: v => v * 0.0254}, yd:{type:'length', toBase: v => v * 0.9144},
    kg:{type:'mass', toBase: v => v}, g:{type:'mass', toBase: v => v / 1000},
    mg:{type:'mass', toBase: v => v / 1e6}, lb:{type:'mass', toBase: v => v * 0.453592},
    oz:{type:'mass', toBase: v => v * 0.0283495}, t:{type:'mass', toBase: v => v * 1000},
    c:{type:'temp', toBase: v => v, fromBase: v => v},
    f:{type:'temp', toBase: v => (v - 32) * 5/9, fromBase: v => v * 9/5 + 32},
    k:{type:'temp', toBase: v => v - 273.15, fromBase: v => v + 273.15},
    l:{type:'volume', toBase: v => v}, ml:{type:'volume', toBase: v => v / 1000},
    gal:{type:'volume', toBase: v => v * 3.78541}, cup:{type:'volume', toBase: v => v * 0.236588},
    s:{type:'time', toBase: v => v}, min:{type:'time', toBase: v => v * 60},
    h:{type:'time', toBase: v => v * 3600}, d:{type:'time', toBase: v => v * 86400},
    wk:{type:'time', toBase: v => v * 604800}, yr:{type:'time', toBase: v => v * 31536000}
  };
  static tryConvert(text){
    const m = String(text).match(/([\d.]+)\s*([a-z]+)\s*(?:a|to|en|à|in|zu|in)\s*([a-z]+)/i);
    if (!m) return null;
    const v = parseFloat(m[1]);
    const from = m[2].toLowerCase();
    const to = m[3].toLowerCase();
    if (!this.UNITS[from] || !this.UNITS[to]) return null;
    if (this.UNITS[from].type !== this.UNITS[to].type) return null;
    let base;
    if (this.UNITS[from].type === 'temp'){
      if (from === 'c') base = v;
      else if (from === 'f') base = (v - 32) * 5/9;
      else base = v - 273.15;
      let result;
      if (to === 'c') result = base;
      else if (to === 'f') result = base * 9/5 + 32;
      else result = base + 273.15;
      return { value: Math.round(result * 1e6) / 1e6, from, to };
    }
    base = this.UNITS[from].toBase(v);
    const result = base / (this.UNITS[to].toBase(1));
    return { value: Math.round(result * 1e6) / 1e6, from, to };
  }
}

/* ---------- PARSER DE FECHA/HORA NATURAL ---------- */
const MONTHS_ES = {enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,setiembre:8,octubre:9,noviembre:10,diciembre:11};
const MONTHS_EN = {january:0,february:1,march:2,april:3,may:4,june:5,july:6,august:7,september:8,october:9,november:10,december:11};
const WEEKDAYS = {domingo:0,lunes:1,martes:2,miercoles:3,miércoles:3,jueves:4,viernes:5,sabado:6,sábado:6,sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6};

class TimeParser{
  static parse(text, now = new Date()){
    const lower = String(text).toLowerCase();
    // en X unidades
    let m = lower.match(/(?:en|dentro de|in|dans|in)\s+(\d+)\s*(segundos?|seconds?|minutos?|minutes?|horas?|hours?|d[ií]as?|days?|semanas?|weeks?)/);
    if (m){
      const n = parseInt(m[1]);
      const u = m[2];
      let ms = 0;
      if (/^s(eg|ec)/.test(u)) ms = n * 1000;
      else if (/^min/.test(u)) ms = n * 60000;
      else if (/^hor|^hour/.test(u)) ms = n * 3600000;
      else if (/^d[ií]|^day/.test(u)) ms = n * 86400000;
      else if (/^sem|^week/.test(u)) ms = n * 604800000;
      return { when: new Date(now.getTime() + ms), what: this.extractWhat(text) };
    }
    // "a las HH:MM" o "a las HH"
    m = lower.match(/a\s+las?\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
    if (m){
      let h = parseInt(m[1]);
      const mi = parseInt(m[2] || '0');
      if (m[3] === 'pm' && h < 12) h += 12;
      if (m[3] === 'am' && h === 12) h = 0;
      if (!m[3] && (lower.includes('tarde') || lower.includes('noche')) && h < 12) h += 12;
      const target = new Date(now);
      if (/mañana/.test(lower) && !/por la mañana/.test(lower)) target.setDate(target.getDate() + 1);
      target.setHours(h, mi, 0, 0);
      if (target <= now) target.setDate(target.getDate() + 1);
      return { when: target, what: this.extractWhat(text) };
    }
    // "mañana" solo
    if (/\bmañana\b/.test(lower) && !/por la mañana/.test(lower) && !/\d/.test(lower)){
      const t = new Date(now); t.setDate(t.getDate() + 1); t.setHours(9, 0, 0, 0);
      return { when: t, what: this.extractWhat(text) };
    }
    // "pasado mañana"
    if (/pasado\s+mañana/.test(lower)){
      const t = new Date(now); t.setDate(t.getDate() + 2); t.setHours(9, 0, 0, 0);
      return { when: t, what: this.extractWhat(text) };
    }
    // Día de semana
    for (const [dayName, dayNum] of Object.entries(WEEKDAYS)){
      if (lower.includes(dayName)){
        const t = new Date(now);
        const diff = (dayNum - t.getDay() + 7) % 7 || 7;
        t.setDate(t.getDate() + diff);
        const tm = lower.match(/a\s+las?\s+(\d{1,2})(?::(\d{2}))?/);
        if (tm) t.setHours(parseInt(tm[1]), parseInt(tm[2]||'0'), 0, 0);
        else t.setHours(9, 0, 0, 0);
        return { when: t, what: this.extractWhat(text) };
      }
    }
    // Fecha específica "el 15 de enero a las 10"
    m = lower.match(/(\d{1,2})\s+de\s+([a-záéíóú]+)(?:\s+(?:a\s+las?\s+)?(\d{1,2})(?::(\d{2}))?)?/);
    if (m && MONTHS_ES[m[2]] !== undefined){
      const d = parseInt(m[1]);
      const mo = MONTHS_ES[m[2]];
      const y = now.getFullYear();
      const t = new Date(y, mo, d, m[3] ? parseInt(m[3]) : 9, m[4] ? parseInt(m[4]) : 0, 0, 0);
      if (t < now) t.setFullYear(y + 1);
      return { when: t, what: this.extractWhat(text) };
    }
    return null;
  }
  static extractWhat(text){
    let m = text.match(/\bque\s+(.+)$/i);
    if (m) return m[1].trim();
    m = text.match(/\b(?:para|de|para que|de que)\s+(.+)$/i);
    if (m) return m[1].trim();
    return text.replace(/\b(recuérdame|recordarme|avísame|avisame|notifícame|notificame|remind me|alerta|programa|programar|agenda|agendar|pon|poner)\b/gi, '').replace(/\s+/g, ' ').trim();
  }
  static describe(d){
    const now = new Date();
    const diff = d - now;
    const abs = Math.abs(diff);
    if (abs < 60000) return 'en menos de un minuto';
    if (abs < 3600000) return `en ${Math.round(abs/60000)} minutos`;
    if (abs < 86400000) return `en ${Math.round(abs/3600000)} horas`;
    if (abs < 604800000) return `en ${Math.round(abs/86400000)} días`;
    return `el ${d.toLocaleDateString('es', {day:'numeric', month:'long', year:'numeric'})} a las ${d.toLocaleTimeString('es', {hour:'2-digit', minute:'2-digit'})}`;
  }
}

/* ---------- BASE DE DATOS (IndexedDB) ---------- */
class DB{
  constructor(){
    this.db = null;
    this.name = 'merida-db';
    this.version = 1;
  }
  async open(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.name, this.version);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('chats')){
          const s = d.createObjectStore('chats', { keyPath: 'id' });
          s.createIndex('updatedAt', 'updatedAt');
        }
        if (!d.objectStoreNames.contains('messages')){
          const s = d.createObjectStore('messages', { keyPath: 'id' });
          s.createIndex('chatId', 'chatId');
          s.createIndex('ts', 'ts');
        }
        if (!d.objectStoreNames.contains('reminders')){
          const s = d.createObjectStore('reminders', { keyPath: 'id' });
          s.createIndex('when', 'when');
        }
        if (!d.objectStoreNames.contains('prefs')) d.createObjectStore('prefs', { keyPath: 'key' });
        if (!d.objectStoreNames.contains('facts')){
          const s = d.createObjectStore('facts', { keyPath: 'id' });
          s.createIndex('key', 'key');
        }
        if (!d.objectStoreNames.contains('learned')){
          const s = d.createObjectStore('learned', { keyPath: 'id' });
          s.createIndex('question', 'question');
        }
      };
      req.onsuccess = () => { this.db = req.result; resolve(); };
      req.onerror = () => reject(req.error);
    });
  }
  _tx(store, mode){ return this.db.transaction(store, mode || 'readonly').objectStore(store); }
  _req(r){ return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

  // CHATS
  async createChat(title){
    const chat = { id: uid(), title: title || 'Nueva conversación', createdAt: Date.now(), updatedAt: Date.now() };
    await this._req(this._tx('chats', 'readwrite').put(chat));
    return chat;
  }
  async getChats(){
    const all = await this._req(this._tx('chats').getAll());
    return all.sort((a, b) => b.updatedAt - a.updatedAt);
  }
  async getChat(id){ return this._req(this._tx('chats').get(id)); }
  async updateChat(id, patch){
    const c = await this.getChat(id); if (!c) return;
    Object.assign(c, patch, { updatedAt: Date.now() });
    await this._req(this._tx('chats', 'readwrite').put(c));
  }
  async deleteChat(id){
    await this._req(this._tx('chats', 'readwrite').delete(id));
    const msgs = await this._req(this._tx('messages').index('chatId').getAll(id));
    const t = this._tx('messages', 'readwrite');
    for (const m of msgs) t.delete(m.id);
    await new Promise(r => t.transaction.oncomplete = r);
  }
  async deleteAllChats(){
    await this._req(this._tx('chats', 'readwrite').clear());
    await this._req(this._tx('messages', 'readwrite').clear());
  }

  // MESSAGES
  async addMessage(chatId, role, content, extra){
    const m = { id: uid(), chatId, role, content, extra: extra || null, ts: Date.now() };
    await this._req(this._tx('messages', 'readwrite').put(m));
    await this.updateChat(chatId, {});
    return m;
  }
  async getMessages(chatId){
    const all = await this._req(this._tx('messages').index('chatId').getAll(chatId));
    return all.sort((a, b) => a.ts - b.ts);
  }
  async deleteMessage(id){ await this._req(this._tx('messages', 'readwrite').delete(id)); }

/* ---------- PROGRAMADOR DE RECORDATORIOS ---------- */
class Scheduler{
  constructor(db){
    this.db = db;
    this.timers = new Map();
    this._init();
    setInterval(() => this._checkDue(), 20000);
  }
  async _init(){
    await sleep(500);
    this._checkDue();
  }
  async _checkDue(){
    try {
      const all = await this.db.getReminders();
      const now = Date.now();
      for (const r of all){
        if (r.fired) continue;
        const delay = r.when - now;
        if (delay <= 0) this._fire(r);
        else if (!this.timers.has(r.id)) this._setTimer(r);
      }
    } catch (_) {}
  }
  _setTimer(r){
    const delay = Math.min(Math.max(r.when - Date.now(), 0), 2147483647);
    const t = setTimeout(() => this._fire(r), delay);
    this.timers.set(r.id, t);
  }
  async _fire(r){
    if (this.timers.has(r.id)){ clearTimeout(this.timers.get(r.id)); this.timers.delete(r.id); }
    await this.db.markReminderFired(r.id);
    try {
      if (window.Notification && Notification.permission === 'granted'){
        const n = new Notification('Mérida — recordatorio', { body: r.message, tag: r.id, requireInteraction: true });
        n.onclick = () => { window.focus(); n.close(); };
      }
    } catch (_) {}
    window.dispatchEvent(new CustomEvent('merida-reminder', { detail: r }));
    showToast('⏰ ' + r.message, 'success', 8000);
  }
  async add(when, message, chatId){
    const r = await this.db.addReminder(when, message, chatId);
    this._setTimer(r);
    return r;
  }
  async listPending(){ return this.db.getPendingReminders(); }
}

/* ---------- RECUPERADOR (BM25 + TF-IDF + fuzzy) ---------- */
class Retriever{
  constructor(docs){
    this.docs = docs || [];
    this._build();
  }
  _build(){
    const N = this.docs.length;
    this.N = N;
    this.avgdl = 0;
    this.df = {};
    this.docsTokens = [];
    this.index = {};
    let totalLen = 0;
    this.docs.forEach((d, i) => {
      const text = (d.title || '') + ' ' + (d.body || '') + ' ' + ((d.tags || []).join(' '));
      const tokens = tokenize(text);
      this.docsTokens.push(tokens);
      totalLen += tokens.length;
      new Set(tokens).forEach(t => { this.df[t] = (this.df[t] || 0) + 1; });
      new Set(tokens).forEach(t => { (this.index[t] = this.index[t] || []).push(i); });
    });
    this.avgdl = totalLen / Math.max(N, 1);
    this.idf = {};
    for (const t in this.df){
      this.idf[t] = Math.log((N - this.df[t] + 0.5) / (this.df[t] + 0.5) + 1);
    }
  }
  add(d){ this.docs.push(d); this._build(); }
  // BM25
  search(q, topK){
    const qTokens = tokenize(q);
    if (!qTokens.length) return [];
    const k1 = 1.5, b = 0.75;
    const scores = new Map();
    const qSet = new Set(qTokens);
    for (const t of qSet){
      const postings = this.index[t]; if (!postings) continue;
      const idf = this.idf[t] || 0;
      const qf = qTokens.filter(x => x === t).length;
      for (const i of postings){
        const dl = this.docsTokens[i].length;
        const tf = this.docsTokens[i].filter(x => x === t).length;
        const score = idf * (tf * (k1 + 1)) / (tf + k1 * (1 - b + b * dl / this.avgdl)) * qf;
        scores.set(i, (scores.get(i) || 0) + score);
      }
    }
    return [...scores.entries()]
      .map(([i, s]) => ({ doc: this.docs[i], score: s }))
      .sort((a, b) => b.score - a.score)
      .slice(0, topK || 3);
  }
  // Búsqueda con fallback fonético
  searchFuzzy(q, topK){
    const direct = this.search(q, topK);
    if (direct.length && direct[0].score > 3) return direct;
    // Fallback: comparar con títulos por Levenshtein
    const qNorm = normalize(q);
    const qWords = qNorm.split(' ').filter(w => w.length > 2);
    const scored = [];
    for (const d of this.docs){
      const titleNorm = normalize(d.title);
      let bestOverlap = 0;
      for (const w of qWords){
        for (const tw of titleNorm.split(' ')){
          const d_ = levenshtein(w, tw);
          const sim = 1 - d_ / Math.max(w.length, tw.length);
          if (sim > bestOverlap) bestOverlap = sim;
        }
      }
      if (bestOverlap > 0.7) scored.push({ doc: d, score: bestOverlap * 10 });
    }
    scored.sort((a, b) => b.score - a.score);
    const merged = [...direct, ...scored.slice(0, topK)];
    const seen = new Set();
    return merged.filter(x => { if (seen.has(x.doc)) return false; seen.add(x.doc); return true; }).slice(0, topK);
  }
}

/* ---------- ROTADOR DE RESPUESTAS (anti-repetición) ---------- */
class TemplateRotator{
  constructor(){
    this.used = new Map();
    this.recentOutputs = [];
    this.MAX_RECENT = 30;
  }
  pick(key, templates){
    if (!templates.length) return '';
    let used = this.used.get(key);
    if (!used){ used = new Set(); this.used.set(key, used); }
    // Si ya se usaron todas, resetear
    const avail = templates.filter(t => !used.has(t));
    if (!avail.length){ used.clear(); return this.pick(key, templates); }
    const chosen = pick(avail);
    used.add(chosen);
    return chosen;
  }
  // Registrar output completo para evitar respuestas idénticas
  registerOutput(text){
    this.recentOutputs.push(text);
    if (this.recentOutputs.length > this.MAX_RECENT) this.recentOutputs.shift();
  }
  isTooSimilar(text){
    const norm = normalize(text);
    for (const prev of this.recentOutputs){
      if (normalize(prev) === norm) return true;
      // Jaccard
      const a = new Set(norm.split(' '));
      const b = new Set(normalize(prev).split(' '));
      let inter = 0;
      for (const x of a) if (b.has(x)) inter++;
      const union = a.size + b.size - inter;
      if (union > 5 && inter / union > 0.85) return true;
    }
    return false;
  }
}

/* ---------- JUEGOS ---------- */
class Games{
  constructor(engine){
    this.engine = engine;
    this.active = null;
  }
  start(type){
    if (type === 'trivia') return this.startTrivia();
    if (type === 'guess') return this.startGuess();
    if (type === 'rps') return this.startRPS();
    if (type === 'adivina') return this.startAdivina();
    if (type === 'hangman') return this.startHangman();
    if (type === '20q') return this.start20Q();
    if (type === 'wordchain') return this.startWordChain();
    return '¿A qué quieres jugar? Puedo jugar: 🎯 trivia, 🎲 adivina el número, ✊ piedra-papel-tijera, 🔍 adivina el tema, 📝 ahorcado, ❓ 20 preguntas, 🔗 cadena de palabras.';
  }
  startTrivia(){
    const qs = [
      {q:'¿Cuál es el planeta más grande del sistema solar?', a:['jupiter','júpiter']},
      {q:'¿Quién pintó la Mona Lisa?', a:['leonardo','da vinci','leonardo da vinci']},
      {q:'¿Cuál es el río más caudaloso del mundo?', a:['amazonas']},
      {q:'¿En qué año llegó el hombre a la Luna?', a:['1969']},
      {q:'¿Cuál es el elemento químico con símbolo "O"?', a:['oxigeno','oxígeno']},
      {q:'¿Quién escribió "Don Quijote de la Mancha"?', a:['cervantes','miguel de cervantes']},
      {q:'¿Cuál es la capital de Francia?', a:['paris','parís']},
      {q:'¿Cuántos huesos tiene el cuerpo humano adulto?', a:['206']},
      {q:'¿Cuál es el océano más grande del mundo?', a:['pacifico','pacífico']},
      {q:'¿Qué gas respiramos las personas para vivir?', a:['oxigeno','oxígeno']},
      {q:'¿Cuál es el animal terrestre más grande?', a:['elefante']},
      {q:'¿Cuántos continentes hay?', a:['7','siete']},
      {q:'¿Cuál es el metal más precioso?', a:['oro','platino']},
      {q:'¿Quién fue el primer presidente de Estados Unidos?', a:['washington','george washington']},
      {q:'¿Cuál es el idioma más hablado del mundo?', a:['chino','mandarin','mandarín']}
    ];
    const q = pick(qs);
    this.active = { type:'trivia', answer: q.a, question: q.q };
    return `🎯 **Trivia**\n\n${q.q}\n\n*(Escribe "rendirse" para saber la respuesta)*`;
  }
  startGuess(){
    this.active = { type:'guess', number: 1 + Math.floor(Math.random() * 100), tries: 0 };
    return '🎲 **Adivina el número**\n\nHe pensado un número del 1 al 100. ¿Cuál crees que es?';
  }
  startRPS(){
    this.active = { type:'rps' };
    return '✊✋✌️ **Piedra, papel o tijera**\n\nDime tu jugada.';
  }
  startAdivina(){
    const doc = pick(this.engine.retriever.docs);
    this.active = { type:'adivina', doc };
    const hint = doc.body.split('.')[0].slice(0, 140);
    return `🔍 **Adivina el tema**\n\nPista: ${hint}…\n\n¿De qué hablo?`;
  }
  startHangman(){
    const words = [
      {w:'javascript', h:'Lenguaje de programación para la web'},
      {w:'elefante', h:'Animal terrestre más grande'},
      {w:'guitarra', h:'Instrumento musical de cuerdas'},
      {w:'biblia', h:'Libro sagrado del cristianismo'},
      {w:'planeta', h:'Cuerpo celeste que orbita una estrella'},
      {w:'computadora', h:'Máquina para procesar información'},
      {w:'mariposa', h:'Insecto de alas coloridas'},
      {w:'historia', h:'Estudio del pasado'},
      {w:'música', h:'Arte de combinar sonidos'},
      {w:'democracia', h:'Gobierno del pueblo'}
    ];
    const {w, h} = pick(words);
    this.active = { type:'hangman', word: w, hint: h, guessed: new Set(), attempts: 6 };
    return `📝 **Ahorcado**\n\nPista: ${h}\n\n${this._hangmanDisplay()}\n\nIntentos restantes: 6\n\nDi una letra.`;
  }
  _hangmanDisplay(){
    const w = this.active.word;
    return w.split('').map(c => this.active.guessed.has(c) ? c : '_').join(' ');
  }
  start20Q(){
    this.active = { type:'20q', questions: 0, chars: ['persona','animal','objeto','lugar'] };
    const char = pick(this.active.chars);
    this.active.char = char;
    this.active.secret = pick(this.engine.retriever.docs).title;
    return `❓ **20 Preguntas**\n\nHe pensado algo de tipo **${char}**. Tienes 20 preguntas para adivinarlo. Responde sí/no.`;
  }
  startWordChain(){
    this.active = { type:'wordchain', lastWord: 'casa', used: new Set(['casa']) };
    return '🔗 **Cadena de palabras**\n\nEmpezamos: **casa**\n\nDime una palabra que empiece con la última letra (a).';
  }
  async handle(input){
    if (!this.active) return null;
    const t = normalize(input);
    if (/rendirse|give up|surrender/.test(t)){
      const was = this.active;
      this.active = null;
      if (was.type === 'trivia') return `La respuesta era **${was.answer[0]}**.\n\n¿Otra ronda?`;
      if (was.type === 'adivina') return `Era **${was.doc.title}**.`;
      if (was.type === 'hangman') return `La palabra era **${was.word}**.`;
      return '¡Buen intento! ¿Jugamos otra vez?';
    }
    if (this.active.type === 'trivia'){
      const ok = this.active.answer.some(a => t.includes(normalize(a)) || normalize(a).includes(t));
      const was = this.active;
      this.active = null;
      return ok ? `✅ ¡Correcto! 🎉\n\n¿Otra ronda? Escribe "trivia".` : `❌ Casi. La respuesta correcta era **${was.answer[0]}**.\n\n¿Probamos otra?`;
    }
    if (this.active.type === 'guess'){
      const n = parseInt(input);
      if (isNaN(n)) return 'Dime un número del 1 al 100. 🙂';
      this.active.tries++;
      if (n === this.active.number){ const tr = this.active.tries; this.active = null; return `🎉 ¡Acertaste en ${tr} intentos! Era el **${n}**.`; }
      return n < this.active.number ? '📈 Más alto.' : '📉 Más bajo.';
    }
    if (this.active.type === 'rps'){
      const opts = ['piedra','papel','tijera'];
      const user = opts.find(o => t.includes(o));
      if (!user) return 'Elige: piedra, papel o tijera.';
      const bot = pick(opts);
      const win = (user==='piedra'&&bot==='tijera')||(user==='papel'&&bot==='piedra')||(user==='tijera'&&bot==='papel');
      const draw = user === bot;
      this.active = null;
      return `Tú: **${user}** — Yo: **${bot}**\n\n${draw ? '🤝 Empate.' : win ? '🎉 ¡Ganaste!' : '😄 ¡Gané!'}`;
    }
    if (this.active.type === 'adivina'){
      const doc = this.active.doc;
      const correct = normalize(doc.title).split(' ').some(w => t.includes(w)) || t === normalize(doc.title);
      this.active = null;
      return correct ? `✅ ¡Exacto! Era **${doc.title}**.` : `❌ No exactamente. Era **${doc.title}**.`;
    }
    if (this.active.type === 'hangman'){
      const letter = input.trim().toLowerCase().match(/[a-záéíóúñ]/);
      if (!letter) return 'Di una letra válida.';
      const L = letter[0];
      if (this.active.guessed.has(L)) return 'Ya probaste esa letra. Prueba otra.';
      this.active.guessed.add(L);
      if (this.active.word.includes(L)){
        const display = this._hangmanDisplay();
        if (!display.includes('_')){ const w = this.active.word; this.active = null; return `🎉 ¡Ganaste! La palabra era **${w}**.`; }
        return `✅ ¡Bien!\n\n${display}\n\nIntentos restantes: ${this.active.attempts}`;
      } else {
        this.active.attempts--;
        if (this.active.attempts <= 0){ const w = this.active.word; this.active = null; return `💀 ¡Ahorcado! La palabra era **${w}**.`; }
        return `❌ No está.\n\n${this._hangmanDisplay()}\n\nIntentos restantes: ${this.active.attempts}`;
      }
    }
    if (this.active.type === '20q'){
      this.active.questions++;
      if (this.active.questions > 20){ const s = this.active.secret; this.active = null; return `Se acabaron las preguntas. Era **${s}**.`; }
      if (/^(s[ií]|yes|no)\b/.test(t)){
        if (/adivina|es\b/i.test(t)){
          const s = this.active.secret; this.active = null; return `¿Es **${s}**?`;
        }
      }
      if (this.active.questions >= 20){
        const s = this.active.secret; this.active = null; return `Era **${s}**.`;
      }
      return `Pregunta ${this.active.questions}/20. Sigue preguntando (sí/no). Si quieres adivinar, escribe "creo que es [algo]".`;
    }
    if (this.active.type === 'wordchain'){
      const word = input.trim().toLowerCase().split(/\s+/)[0];
      const lastChar = this.active.lastWord.slice(-1);
      if (!word.startsWith(lastChar)) return `La palabra debe empezar con **${lastChar}**. Intenta de nuevo.`;
      if (this.active.used.has(word)) return 'Esa palabra ya se usó. Prueba otra.';
      this.active.used.add(word);
      // Respuesta del bot: buscar palabra en KB
      const candidates = this.engine.retriever.docs.map(d => d.title.toLowerCase().split(' ')[0]).filter(w => w.startsWith(word.slice(-1)) && !this.active.used.has(w));
      if (!candidates.length){ this.active = null; return `🎉 ¡Ganaste! No encuentro más palabras.`; }
      const botWord = pick(candidates);
      this.active.used.add(botWord);
      this.active.lastWord = botWord;
      return `Mi palabra: **${botWord}**\n\nTu turno: empieza con **${botWord.slice(-1)}**`;
    }
    return null;
  }
}
